<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AaiyyanMath</title>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="bar">
    <span class="brand"><b>&Sigma;</b> AaiyyanMath</span>
    <button id="tTools" class="tog on" title="Show / hide tools  (Ctrl+1)">Tools</button>
    <button id="tCanvas" class="tog on" title="Show / hide canvas  (Ctrl+2)">Canvas</button>
    <button id="tCode" class="tog on" title="Show / hide Python  (Ctrl+3)">Python</button>
    <span class="gap"></span>
    <button id="add">+ Region</button>
    <button id="undo" title="Ctrl+Z">Undo</button>
    <button id="redo" title="Ctrl+Shift+Z">Redo</button>
    <button id="copy">Copy script</button>
    <span id="stat"></span>
  </div>
  <div id="grid">
    <aside id="tools"></aside>
    <div id="splitL" class="split v"></div>
    <div id="main">
      <section id="canvas"><div id="world"></div><div id="hint">Click the canvas to place maths</div></section>
      <div id="splitB" class="split h"></div>
      <section id="code">
        <div class="chead"><span>Python</span><span class="sub">one line per region — edit either side</span></div>
        <textarea id="py" spellcheck="false"></textarea>
      </section>
    </div>
  </div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
